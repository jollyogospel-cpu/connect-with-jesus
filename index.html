    }
    main { max-width: 760px; }

      margin: 0;
      font-size: clamp(2rem, 7vw, 4.5rem);
      line-height: 1.2;
      font-weight: 800;
    }

  <main>
    <h1>Jesus is the only connection you need</h1>
  </main>

</html>
